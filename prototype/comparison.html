<style>
:root{--blue:#44C7F4;--ink:#14181B;--mist:#F2F5F7;--line:#E2E8EC;--white:#fff;--ok:#1FA971;--warn:#E8A13C;--dim:#8A9AA5;--slate:#4D4D4D}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--mist);color:var(--ink);font:13.5px/1.5 Inter,system-ui,sans-serif;display:flex;flex-direction:column}
header{background:var(--ink);color:#B9C6CE;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header b{font-family:"Barlow Semi Condensed";font-size:17px;color:#fff}
header .note{font-size:12px;color:var(--dim)}
.scrn{display:flex;gap:4px;overflow-x:auto;padding:8px 14px;background:#1F262B;flex-shrink:0}
.scrn button{flex-shrink:0;border:1px solid #33414B;background:none;color:#B9C6CE;border-radius:14px;padding:3px 11px;font:12px Inter;cursor:pointer;white-space:nowrap}
.scrn button.on{background:var(--blue);color:var(--ink);border-color:var(--blue);font-weight:600}
.scrn button.ok::after{content:" ✓";color:inherit}
.panes{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:0}
.pane{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.pane h2{font:600 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);background:var(--white);border-bottom:1px solid var(--line);margin:0;padding:7px 14px}
.pane h2 span{color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0}
iframe{flex:1;width:100%;border:0;background:#fff}
body.mobile iframe{width:375px;margin:0 auto;box-shadow:0 0 0 1px var(--line)}
.verdict{flex-shrink:0;display:flex;gap:12px;align-items:center;background:var(--white);border-top:2px solid var(--blue);padding:9px 16px;flex-wrap:wrap}
.verdict label{display:flex;gap:6px;align-items:center;font-weight:600;cursor:pointer}
.verdict input[type=text]{flex:1;min-width:180px;font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.verdict .prog{font-family:"IBM Plex Mono";font-size:12px;color:var(--slate)}
.btn{border:1px solid var(--line);background:var(--white);border-radius:6px;padding:6px 12px;font:600 12.5px Inter;cursor:pointer}
.btn.pri{background:var(--blue);border-color:var(--blue)}
</style>

function decide(v){const t=S.talks[S.selTalk];if(!t||t.review!==&#x27;awaiting_review&#x27;&amp;&amp;t.review!==&#x27;in_review&#x27;)return;
  t.review=v;

    if(S.selTalk===&#x27;raman&#x27;){t.sync=&#x27;syncing&#x27;;t.ack=false;setTimeout(()=&gt;{t.sync=&#x27;active&#x27;;render();toast(&#x27;Ballroom A synced — awaiting room technician acknowledgment&#x27;)},1500);}
    else t.sync=&#x27;syncing&#x27;;
    toast(&#x27;Approved — delta manifest queued for &#x27;+t.room);
  } else if(v===&#x27;changes_requested&#x27;){t.versions[t.versions.length-1].state=&#x27;changes_requested&#x27;;toast(&#x27;Revision requested — speaker notified via speaker-visible comment&#x27;);}

<script>
'use strict';
const SCREENS=[["portfolio", "Portfolio", "Portfolio"], ["wizard", "Create event", "Create event"], ["import", "Schedule import", "Schedule import"], ["command", "Command center", "Command center"], ["speakers", "Speakers", "Speakers"], ["detail", "Presentation detail", "Presentation detail"], ["inspect", "Inspection", "Inspection"], ["review", "Review & approval", "Review & approval"], ["comms", "Communications", "Communications"], ["archive", "Archive builder", "Archive builder"], ["srr", "Speaker Ready Room", "Speaker Ready Room"], ["checkin", "Check-in", "Check-in"], ["ingest", "USB intake", "USB intake"], ["sync", "Room sync", "Room sync"], ["agent", "Room Agent", "Room Agent (Ballroom A)"], ["speaker", "Speaker portal", "Speaker portal"], ["client", "Client portal", "Client portal"]];
let cur=0, store={};

const $=id=>document.getElementById(id);
function renderTabs(){
  $('scrn').innerHTML=SCREENS.map((s,i)=>`<button class="${i===cur?'on':''} ${store[s[0]]&&store[s[0]].ok?'ok':''}" onclick="go(${i})">${i+1}. ${s[1]}</button>`).join('');

}
function go(i){cur=i;const[k,,bl]=SCREENS[i];
  const rec=store[k]||{}; $('appr').checked=!!rec.ok; $('notes').value=rec.notes||'';
  try{$('ef').contentWindow.nav(k);}catch(e){}

function navBaseline(label){
  try{const d=$('bf').contentDocument;
    const btns=[...d.querySelectorAll('button')];

}
function save(){const k=SCREENS[cur][0];
