<meta charset="utf-8">
<title>DXG PM Enhanced Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Faithful to prototype/client-baseline.html tokens (D-010). Single-theme by design, matching the baseline. */
:root{
  --blue:#44C7F4; --blueDark:#1793C4; --ink:#14181B; --ink2:#1F262B; --slate:#4D4D4D;
  --mist:#F2F5F7; --line:#E2E8EC; --white:#FFFFFF; --ok:#1FA971; --warn:#E8A13C; --block:#D64545;
  --sync:#7A6FF0; --dim:#8A9AA5; --paneink:#B9C6CE;
  --ok-soft:#E7F7F0; --warn-soft:#FCF3E3; --bad-soft:#FBEAEA; --info-soft:#E6F6FC; --sync-soft:#EFEDFC;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--mist);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;display:flex;flex-direction:column}
h1,h2,h3{font-family:"Barlow Semi Condensed",sans-serif;margin:0;letter-spacing:.005em}
.mono{font-family:"IBM Plex Mono",monospace}
button{font:inherit;cursor:pointer}
.shell{display:flex;flex:1;min-height:0}
/* sidebar */
aside{width:216px;flex-shrink:0;background:var(--ink);color:var(--paneink);display:flex;flex-direction:column;overflow-y:auto}
.logo{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.logo b{font-family:"Barlow Semi Condensed";font-weight:700;font-size:19px;color:var(--white);letter-spacing:.02em}
.logo .clock{font-family:"IBM Plex Mono";font-size:13px;color:var(--blue)}
.evtctx{padding:2px 16px 10px;font-family:"IBM Plex Mono";font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.grp{padding:10px 16px 4px;font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
aside nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;color:var(--paneink);padding:8px 16px;font-size:13.5px}
aside nav button::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--slate)}
aside nav button.on{background:#22303A;color:var(--white)} aside nav button.on::before{background:var(--blue)}
aside nav button:not(.on):hover{background:var(--ink2)}
.demo-btn{margin:12px;padding:9px;border:none;border-radius:6px;background:var(--blue);color:var(--ink);font-weight:700;font-size:13.5px}
.demo-btn.stop{background:#22303A;color:var(--paneink)}
/* main */
main{flex:1;min-width:0;overflow-y:auto;padding:24px}
.htitle{font-size:23px;font-weight:700;margin-bottom:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.card .chd{display:flex;align-items:baseline;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--line)}
.card .chd h3{font-size:15px;font-weight:600}
.card .chd .m{font-family:"IBM Plex Mono";font-size:12px;color:var(--dim)}
.cbd{padding:14px 16px}
.krow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi .kl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.kpi .kv{font-family:"Barlow Semi Condensed";font-weight:700;font-size:24px;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:2px 12px 8px;font-weight:600}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr.rb{cursor:pointer} tr.rb:hover td{background:var(--mist)} tr.sel td{background:var(--info-soft)}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-block;border-radius:12px;padding:2px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:#8A5A12}
.c-bad{background:var(--bad-soft);color:var(--block)} .c-info{background:var(--info-soft);color:var(--blueDark)}
.c-sync{background:var(--sync-soft);color:var(--sync)} .c-mut{background:var(--mist);color:var(--slate)}
.btn{border:1px solid var(--line);background:var(--white);color:var(--ink);padding:7px 14px;border-radius:6px;font-weight:600;font-size:13px}
.btn:hover{background:var(--mist)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--ink)} .btn.pri:hover{background:var(--blueDark);color:var(--white)}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warnb{color:#8A5A12;border-color:var(--warn)}
.btn.danger{color:var(--block);border-color:var(--block)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,aside nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bar{height:8px;border-radius:5px;background:var(--mist);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)} .bar.blue i{background:var(--blue)} .bar.warn i{background:var(--warn)}
.lane{border-left:3px solid var(--line);background:var(--mist);border-radius:0 6px 6px 0;padding:8px 12px;margin:8px 0;font-size:13px}
.lane b{font-size:12.5px} .lane .aud{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-left:6px}
.lane.int{border-color:var(--slate)} .lane.cli{border-color:var(--warn)} .lane.spk{border-color:var(--blue)}
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.slides div{aspect-ratio:16/9;background:var(--mist);border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-family:"IBM Plex Mono";font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.roomcard{border:1px solid var(--line);border-radius:8px;background:var(--white);padding:12px 14px}
.roomcard h4{font-family:"Barlow Semi Condensed";font-size:15px;margin:0 0 2px}
.frow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--white);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
label{font-size:12px;color:var(--slate);font-weight:600;display:block;margin-bottom:4px}
.field{margin-bottom:12px}
/* dark surfaces: login, agent, portals headers */
.darkpane{background:var(--ink);color:var(--paneink);border-radius:8px}
.demo-bar{flex-shrink:0;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paneink);padding:10px 16px;font-size:13.5px;border-top:2px solid var(--blue)}
.demo-bar b{color:var(--blue);font-family:"IBM Plex Mono")}
.toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.hidden{display:none!important}
.note{font-size:12.5px;color:var(--slate)}
@media (max-width:560px){aside{width:64px}.logo b{font-size:12px}.evtctx,.grp,.logo .clock{display:none}aside nav button{padding:8px 10px;font-size:11px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell">
<aside>
  <div class="logo"><b>DXG·PM</b><span class="clock" id="clock">10:24:08</span></div>
  <div class="evtctx">MedTech Fwd 26 · Day 2</div>
  <nav id="nav"></nav>
  <button class="demo-btn" id="demoBtn" onclick="demoToggle()">▶ Run 19-step demo</button>
</aside>
<main id="main"></main>
</div>
<div class="demo-bar hidden" id="demoBar">
  <b id="demoNum">Step 1/19</b><span id="demoText"></span>
  <span style="margin-left:auto"></span>
  <button class="btn" onclick="demoPrev()">‹ Back</button>
  <button class="btn pri" onclick="demoNext()">Next ›</button>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800);}
setInterval(()=>{const d=new Date();$('clock').textContent=d.toTimeString().slice(0,8)},1000);

/* ── store: live workflow state (graft from workflow-study; WORKFLOW_STATES §1–§4, §8) ── */
const S={
  screen:'portfolio', selTalk:'raman',
  talks:{
    raman:{name:'Dr. P. Raman',talk:'Robotic-Assisted Surgery Outcomes',track:'Surgical Innovation',room:'Ballroom A',slot:'Day 2 · 10:30',
      versions:[{v:1,size:'480 MB',state:'superseded'},{v:2,size:'505 MB',state:'approved'}],
      insp:{chip:'c-warn',text:'Warning · HEVC video on slide 18 — will be transcoded for the room PC'},
      review:'approved', sync:'active', ack:true, upPct:100},
    osei:{name:'K. Osei',talk:'Wearable Sensor Talk',track:'Digital Health',room:'Ballroom B',slot:'Day 2 · 13:15',
      versions:[{v:1,size:'96 MB',state:'awaiting_review'}],
      insp:{chip:'c-warn',text:'Warning · font “Neo Sans Std” not on room build (slides 4, 12)'},
      review:'awaiting_review', sync:'none', ack:true, upPct:100},
    fontaine:{name:'A. Fontaine',talk:'CardioNext Trial Results',track:'Cardiology',room:'Ballroom A',slot:'Day 2 · 14:00',
      versions:[{v:1,size:'148 MB',state:'awaiting_review'}],
      insp:{chip:'c-ok',text:'Passed · fonts embedded, media OK. Automated checks can’t judge content — reviewer decides.'},
      review:'awaiting_review', sync:'none', ack:true, upPct:100},
  },
  usb:{scanned:false, signed:false},
  demo:{on:false, i:0},
};
const derived=t=>{
  if(t.review==='awaiting_review'||t.review==='in_review')return['Submitted','c-info'];
  if(t.review==='changes_requested')return['Revision requested','c-warn'];
  if(t.review==='approved'&&t.sync!=='active')return['Approved · syncing','c-sync'];
  if(t.review==='approved'&&!t.ack)return['Update pending ack','c-warn'];
  if(t.review==='approved')return['Synchronized onsite','c-ok'];
  return['Not submitted','c-mut'];
};
const queue=()=>Object.entries(S.talks).filter(([,t])=>t.review==='awaiting_review'||t.review==='in_review');

/* ── navigation (baseline IA, D-010) ── */
const NAV=[['CONTROL CENTER',[['portfolio','Portfolio'],['wizard','Create event'],['import','Schedule import'],['command','Command center'],['speakers','Speakers'],['detail','Presentation detail'],['inspect','Inspection'],['review','Review & approval'],['comms','Communications'],['archive','Archive builder']]],
  ['ONSITE',[['srr','Speaker Ready Room'],['checkin','Check-in'],['ingest','USB intake'],['sync','Room sync']]],
  ['DEVICE',[['agent','Room Agent (Ballroom A)']]],
  ['EXTERNAL',[['speaker','Speaker portal'],['client','Client portal']]]];
function nav(scr){S.screen=scr;render();}
function renderNav(){
  $('nav').innerHTML=NAV.map(([g,items])=>`<div class="grp">${g}</div>`+items.map(([k,l])=>
    `<button class="${S.screen===k?'on':''}" onclick="nav('${k}')">${l}</button>`).join('')).join('');
}

/* ── screens ── */
const V={};

V.portfolio=()=>`<h1 class="htitle">Event portfolio</h1>
<div class="card" style="border-color:var(--blue)"><div class="cbd">
  <div style="display:flex;justify-content:space-between;align-items:baseline"><h3 style="font-size:17px">MedTech Forward 2026</h3><span class="chip c-info">Onsite now</span></div>
  <div class="note">Tampa Convention Center · Mar 10–12, 2026</div>
  <div class="bar" style="margin:10px 0 4px"><i style="width:87%"></i></div>
  <div style="display:flex;justify-content:space-between"><span class="chip c-warn" id="pf-warn"></span><span class="mono num">87%</span></div>
</div></div>
<div class="card"><div class="cbd">
  <div style="display:flex;justify-content:space-between;align-items:baseline"><h3 style="font-size:17px">Gulf Coast HR Summit</h3><span class="chip c-mut">Closed</span></div>
  <div class="note">JW Marriott Water Street · Jan 21–22, 2026</div>
  <div class="bar" style="margin:10px 0 4px"><i style="width:100%"></i></div>
  <div style="display:flex;justify-content:space-between"><span class="note">No unresolved warnings</span><span class="mono num">100%</span></div>
</div></div>`;

V.wizard=()=>`<h1 class="htitle">Create event</h1>
<div class="card"><div class="chd"><h3>Event details</h3><span class="m">step 1 of 3</span></div><div class="cbd">
  <div class="grid2">
    <div class="field"><label>Event name</label><input style="width:100%" value="MedTech Forward 2026"></div>
    <div class="field"><label>Client</label><select style="width:100%"><option>MedTech Industry Association</option></select></div>
    <div class="field"><label>Venue</label><input style="width:100%" value="Tampa Convention Center"></div>
    <div class="field"><label>Time zone</label><select style="width:100%"><option>America/New_York</option></select></div>
    <div class="field"><label>Dates</label><input style="width:100%" value="Mar 10 – Mar 12, 2026"></div>
    <div class="field"><label>Upload deadline</label><input style="width:100%" value="Mar 3, 2026 · 23:59"></div>
  </div>
  <div class="note" style="margin-bottom:10px">⚠ Invitations can’t be sent until the event has at least one day and one room.</div>
  <button class="btn pri" onclick="toast('Rooms & deadlines — step 2 (not in this walkthrough)')">Continue → Rooms</button>
  <button class="btn" onclick="toast('Duplicated structure only — no speaker files or statuses copied')">Duplicate from Gulf Coast HR Summit</button>
</div></div>`;

V.import=()=>`<h1 class="htitle">Schedule import</h1>
<div class="card"><div class="chd"><h3>medtech_agenda_v4.xlsx</h3><span class="m">348 rows · mapped automatically</span></div><div class="cbd">
  <table><thead><tr><th>Sheet column</th><th>Mapped to</th><th>Sample</th></tr></thead><tbody>
  <tr><td class="mono">B · Session Title</td><td>Session · title</td><td>Robotics Live Lab</td></tr>
  <tr><td class="mono">D · Hall</td><td>Room</td><td>Ballroom A</td></tr>
  <tr><td class="mono">E · Start</td><td>Session · start</td><td class="mono num">Mar 11 10:30</td></tr>
  <tr><td class="mono">H · Presenter Email</td><td>Speaker · email</td><td class="mono">p.raman@…</td></tr>
  </tbody></table>
  <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
    <span class="chip c-ok">344 rows valid</span><span class="chip c-warn">4 rows: unknown room “Hall C” — fix or skip</span>
  </div>
  <div style="margin-top:12px"><button class="btn pri" onclick="toast('Committed transactionally — 344 sessions created, 4 skipped rows reported')">Commit 344 rows</button>
  <button class="btn" onclick="toast('Re-import matches by room+start+title — updates existing sessions, no duplicates')">Re-import updated file…</button></div>
</div></div>`;

V.command=()=>{const q=queue().length;const readyRooms=S.talks.raman.sync==='active'&&S.talks.raman.ack?13:12;
 return `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px">
  <div><h1 class="htitle" style="margin-bottom:2px">MedTech Forward 2026</h1><span class="note">Tampa Convention Center · Day 2 of 3 · Doors 08:00</span></div>
  <button class="btn" onclick="toast('Reminder batch queued to 45 speakers with missing files')">Send reminder batch</button></div>
<div class="krow">
  <div class="kpi"><div class="kl">Collected</div><div class="kv num">303 / 348</div><div class="note">87% of talks</div></div>
  <div class="kpi"><div class="kl">Approved</div><div class="kv num" style="color:var(--ok)">${269+Object.values(S.talks).filter(t=>t.review==='approved').length}</div></div>
  <div class="kpi"><div class="kl">Warnings open</div><div class="kv num" style="color:var(--warn)">5</div></div>
  <div class="kpi"><div class="kl">Missing</div><div class="kv num" style="color:var(--block)">45</div></div>
  <div class="kpi"><div class="kl">Rooms ready</div><div class="kv num" style="color:var(--sync)">${readyRooms} / 14</div></div>
</div>
<div class="card"><div class="chd"><h3>Live status — today’s talks</h3><span class="m">derived automatically; click to open</span></div>
<div class="cbd" style="padding:0 0 4px"><table><thead><tr><th>Talk</th><th>Speaker</th><th>Room · slot</th><th>Status</th></tr></thead><tbody>
${Object.entries(S.talks).map(([k,t])=>{const[l,c]=derived(t);return `<tr class="rb" onclick="S.selTalk='${k}';nav('detail')"><td><b>${t.talk}</b></td><td>${t.name}</td><td>${t.room} · ${t.slot}</td><td><span class="chip ${c}">${l}</span></td></tr>`}).join('')}
</tbody></table></div></div>`};

V.speakers=()=>`<h1 class="htitle">Speakers</h1>
<div class="card"><div class="cbd" style="padding-bottom:6px"><input placeholder="Search 348 speakers…" style="width:100%"></div>
<div class="cbd" style="padding-top:0"><table><thead><tr><th>Speaker</th><th>Talks</th><th>Link status</th><th>Last activity</th></tr></thead><tbody>
${Object.values(S.talks).map(t=>`<tr class="rb" onclick="nav('detail')"><td><b>${t.name}</b><br><span class="note">${t.track}</span></td><td>${t.talk}</td><td><span class="chip c-info">Invited · link active</span></td><td class="mono num">Day 2 · 09:1${Math.floor(Math.random()*9)}</td></tr>`).join('')}
</tbody></table></div></div>`;

V.detail=()=>{const t=S.talks[S.selTalk];const[l,c]=derived(t);
 return `<h1 class="htitle">Presentation detail</h1>
<div class="card"><div class="chd"><h3>${t.talk}</h3><span class="chip ${c}">${l}</span></div><div class="cbd">
  <div class="note" style="margin-bottom:10px">${t.name} · ${t.track} · ${t.room} · ${t.slot}</div>
  <h3 style="font-size:13px;margin-bottom:6px">Version history</h3>
  <table><thead><tr><th>Version</th><th>Size</th><th>State</th><th></th></tr></thead><tbody>
  ${t.versions.map(v=>`<tr><td class="mono">v${v.v}</td><td class="num">${v.size}</td><td><span class="chip ${v.state==='approved'?'c-ok':v.state==='superseded'?'c-mut':'c-info'}">${v.state.replace('_',' ')}</span></td>
   <td>${v.state==='approved'?'<span class="chip c-sync">Final onsite version</span>':''}</td></tr>`).join('')}
  </tbody></table>
  <div style="margin-top:10px"><button class="btn" onclick="toast('Prior approved version restored byte-identically — Ballroom A notified')">Roll back to previous approved…</button></div>
</div></div>`};

V.inspect=()=>{const t=S.talks[S.selTalk]||S.talks.raman;
 return `<h1 class="htitle">Inspection</h1>
<div class="card"><div class="chd"><h3>${t.talk} · v${t.versions.length}</h3><span class="m">tier-1 automated checks</span></div><div class="cbd">
  <table><thead><tr><th>Check</th><th>Result</th></tr></thead><tbody>
   <tr><td>File integrity · SHA-256</td><td><span class="chip c-ok">Verified</span> <span class="mono note">9f2c…e1d7</span></td></tr>
   <tr><td>Fonts</td><td><span class="chip ${t.insp.chip==='c-warn'&&t.insp.text.includes('font')?'c-warn':'c-ok'}">${t.insp.text.includes('font')?'Warning':'Embedded'}</span></td></tr>
   <tr><td>Video codecs</td><td><span class="chip ${t.insp.text.includes('HEVC')?'c-warn':'c-ok'}">${t.insp.text.includes('HEVC')?'HEVC on slide 18':'H.264 ✓'}</span></td></tr>
   <tr><td>Macros / external links</td><td><span class="chip c-ok">None found</span></td></tr>
   <tr><td>Malware scan</td><td><span class="chip c-ok">Clean · 6s</span></td></tr>
  </tbody></table>
  <div class="lane int" style="margin-top:12px"><b>What these checks can’t see:</b> content accuracy, slide design, or whether animations behave on the room PC — those need the reviewer and the fidelity test. <span class="chip ${t.insp.chip}" style="margin-left:6px">${t.insp.text}</span></div>
  <button class="btn warnb" onclick="toast('Finding waived by M. Vega — waiver stays visible and audited');this.disabled=true">Waive finding…</button>
</div></div>`};

V.review=()=>{const q=queue();const t=S.talks[S.selTalk];const inQ=q.some(([k])=>k===S.selTalk);
 return `<h1 class="htitle">Review & approval</h1>
<div class="card"><div class="chd"><h3>Queue · ${q.length+9}</h3><span class="m">oldest first · A approve · R request revision</span></div>
<div class="cbd" style="padding:0 0 4px"><table><tbody>
${q.length?q.map(([k,t])=>`<tr class="rb ${k===S.selTalk?'sel':''}" onclick="S.selTalk='${k}';render()"><td><b>${t.name}</b> · ${t.talk}</td><td style="text-align:right"><span class="chip ${t.insp.chip}">${t.insp.chip==='c-ok'?'Submitted':'Warning'}</span></td></tr>`).join(''):'<tr><td class="note" style="text-align:center;padding:18px">Queue clear — 9 items with other reviewers</td></tr>'}
</tbody></table></div></div>
${inQ?`<div class="card"><div class="chd"><h3>Preview · ${t.talk.toLowerCase().split(' ')[0]}_v${t.versions.length}</h3><span class="m">v${t.versions.length} · 42 slides</span></div><div class="cbd">
  <div class="slides">${[1,2,3,4,5,6,7,8].map(n=>`<div>${n}</div>`).join('')}</div>
  <div style="margin:10px 0"><span class="chip ${t.insp.chip}">${t.insp.text}</span></div>
  <div class="lane int"><b>M. Vega</b><span class="aud">internal</span><br>Fallback font is acceptable for titles.</div>
  <div class="lane cli"><b>J. Ellis</b><span class="aud">client review</span><br>Please prioritize — board members attending this one.</div>
  <div class="lane spk"><b>To speaker</b><span class="aud">speaker-visible</span><br>Approved with a note: embed fonts on future versions.</div>
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn good" onclick="decide('approved')">Approve (A)</button>
    <button class="btn" onclick="decide('changes_requested')">Request revision (R)</button>
    <button class="btn danger" onclick="decide('rejected')">Reject…</button>

/* ── behaviors (grafted from workflow-study) ── */
function decide(v){const t=S.talks[S.selTalk];if(!t||t.review!=='awaiting_review'&&t.review!=='in_review')return;
  t.review=v;
  if(v==='approved'){t.versions[t.versions.length-1].state='approved';
    if(S.selTalk==='raman'){t.sync='syncing';t.ack=false;setTimeout(()=>{t.sync='active';render();toast('Ballroom A synced — awaiting room technician acknowledgment')},1500);}
    else t.sync='syncing';
    toast('Approved — delta manifest queued for '+t.room);
  } else if(v==='changes_requested'){t.versions[t.versions.length-1].state='changes_requested';toast('Revision requested — speaker notified via speaker-visible comment');}
  else toast('Rejected — speaker and client admin notified');
  render();}
document.addEventListener('keydown',e=>{if(S.screen!=='review')return;
  if(e.key==='a'||e.key==='A')decide('approved'); if(e.key==='r'||e.key==='R')decide('changes_requested');});

let upT=null;
function startUp(){const t=S.talks.raman;t.upPct=1;render();tick();}
function tick(){const t=S.talks.raman;upT=setInterval(()=>{t.upPct+=Math.random()*6;
  if(t.upPct>=68&&!S._dropped){clearInterval(upT);S._dropped=true;render();
    const m=$('upmsg'),b=$('upresume');if(m){m.textContent='Connection lost at 68% — 343 MB already uploaded is saved.';m.style.color='#8A5A12';}if(b)b.classList.remove('hidden');return;}
  if(t.upPct>=100){t.upPct=100;clearInterval(upT);render();toast('Checksum verified — inspection queued');return;}
  const bar=document.querySelector('.bar.blue i');const m=$('upmsg');
  if(bar)bar.style.width=t.upPct+'%'; if(m)m.textContent='Uploading… '+Math.round(t.upPct)+'%';},170);}
function resumeUp(){const m=$('upmsg');if(m){m.textContent='Resumed from 68% — not from zero.';m.style.color='';}
  $('upresume').classList.add('hidden');tick();}

function usbScan(){$('scanbtn').classList.add('hidden');$('scanrun').classList.remove('hidden');
  setTimeout(()=>{S.usb.scanned=true;render();toast('Malware scan clean in 8s — v3 created, original preserved')},1500);}
function signOff(){const t=S.talks.raman;S.usb.signed=true;
  t.versions.push({v:3,size:'548 MB',state:'awaiting_review'});t.review='awaiting_review';t.sync='none';S.selTalk='raman';
  render();toast('Signed off — v3 entered re-approval; Ballroom A keeps v2 until approved');}
function ackChange(){S.talks.raman.ack=true;render();toast('Change acknowledged — Ballroom A readiness green');}

/* ── 19-step demo (verbatim from client baseline; docs/ACCEPTANCE_WALKTHROUGH.md) ── */
const DEMO=[["wizard","PM creates the 3-day conference"],["import","Rooms, sessions & speakers imported from Excel"],
 ["comms","Branded upload invitations sent (348)"],["speaker","Dr. Raman opens her secure link"],
 ["speaker","She uploads a deck (480 MB, resumable)"],["inspect","Inspection flags an HEVC video warning"],
 ["review","DXG reviewer requests a revision"],["speaker","Corrected v2 uploaded — checks pass"],
 ["review","DXG approves the presentation"],["sync","v2 syncs to the Ballroom A computer"],
 ["checkin","Speaker checks into the Speaker Ready Room"],["ingest","One final update arrives on USB"],
 ["checkin","Technician approves v3 · speaker signs off"],["agent","Room technician sees the change alert"],
 ["agent","Final file synchronized · v2 kept for rollback"],["sync","Slot marked ready — readiness grid green"],
 ["agent","Presentation launched · logged 10:31"],["archive","Final version included in the archive build"],
 ["client","Client downloads the permitted package"]];
function demoToggle(){S.demo.on=!S.demo.on;S.demo.i=0;
  $('demoBar').classList.toggle('hidden',!S.demo.on);
  $('demoBtn').textContent=S.demo.on?'■ Exit demo':'▶ Run 19-step demo';
  $('demoBtn').classList.toggle('stop',S.demo.on);
  if(S.demo.on)demoShow();else render();}
function demoShow(){const[scr,txt]=DEMO[S.demo.i];S.screen=scr;
  $('demoNum').textContent=`Step ${S.demo.i+1}/19`;$('demoText').textContent=txt;render();}
function demoNext(){if(S.demo.i<18){S.demo.i++;demoShow();}else demoToggle();}
function demoPrev(){if(S.demo.i>0){S.demo.i--;demoShow();}}

function render(){renderNav();$('main').innerHTML=V[S.screen]();
  const pf=$('pf-warn');if(pf)pf.textContent=`${5+queue().length} unresolved warnings`;}
render();
</script>
