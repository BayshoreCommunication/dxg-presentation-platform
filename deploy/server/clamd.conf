# ClamAV daemon settings: the image's own defaults (its start-up script waits for the
# local socket, and runs as `clamav`), plus limits large enough for presentation decks.
# The defaults cap a scanned stream at 25 MB, which would make clamd refuse — and the API
# fail closed on — any real deck.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
StreamMaxLength 2000M
MaxScanSize 2000M
MaxFileSize 2000M
ReadTimeout 300
