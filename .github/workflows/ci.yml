# Continuous integration (production readiness). Every push and pull request:
#   checks     — lint, type-check every app, unit tests
#   invariants — the API against a real Postgres (migrated + seeded), then the invariant suite
#   images     — the four production images build (nothing is pushed)
#   publish    — on the `production` branch only, once the three above pass: the same images (from
#                the build cache) are pushed to ECR tagged with the 7-character commit, for deploy.sh
#                (D-149). Releasing = merging main into production.
# Pushes to main and production both run the checks; pull requests run everything but publish.
name: CI

on:
  push:
    branches: [main, production]
  pull_request:

# The Room Agent's tests use the fake driver; no job needs Electron's binary.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels an older run, except on production: a release in progress finishes (D-191).
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.21.0, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Type-check every app
        run: |
          for app in api dispatcher control-center speaker-portal; do
            echo "::group::$app"; (cd apps/$app && npx tsc --noEmit -p .); echo "::endgroup::"
          done
      - run: npm test

  invariants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_DB: pmp_dev,
            POSTGRES_USER: pmp,
            POSTGRES_PASSWORD: pmp_dev,
          }
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U pmp -d pmp_dev" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5434'
      PGDATABASE: pmp_dev
      MAIL_TRANSPORT: file
      REMINDERS_DISABLED: '1'
      EMAIL_DNS_CHECK: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.21.0, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run db:migrate && npm run db:seed
      - name: Start the API, the background worker and the mail dispatcher
        run: |
          node apps/api/src/index.ts > api.log 2>&1 &
          node apps/api/src/worker.ts > worker.log 2>&1 &
          node apps/dispatcher/src/index.ts > dispatcher.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4000/ops/health && break; sleep 1; done
      - run: npm run test:invariants
      - if: failure()
        run: tail -n 200 api.log worker.log dispatcher.log

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, dispatcher, staff, portal]
    steps:
      - uses: actions/checkout@v4
      # Rebuilds the `runtime` stage (apt-get upgrade) once a week so Debian's security fixes reach
      # the images even though everything else comes from the build cache (D-152).
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server/Dockerfile
          target: ${{ matrix.target }}
          push: false
          build-args: SECURITY_REFRESH=${{ steps.week.outputs.week }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # Production images (D-149). Only on a push to `production`, only after every check passed. The
  # build is the `images` job's again, so mostly cache hits; GitHub signs in to AWS with OIDC (role
  # pmp-github-image-push, which trusts this repository's production branch only — no stored keys).
  # The tags are immutable in ECR: a commit is built once.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [checks, invariants, images]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        target: [api, dispatcher, staff, portal]
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::295229565954:role/pmp-github-image-push
          aws-region: us-east-2
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: SECURITY_REFRESH=${{ steps.week.outputs.week }}
          tags: ${{ steps.ecr.outputs.registry }}/pmp-${{ matrix.target }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.target }}
      - run: |
          echo "pmp-${{ matrix.target }}:${{ steps.tag.outputs.tag }} pushed." >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy on the server: \`cd /opt/pmp/deploy/server && ./deploy.sh ${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  # Automatic deploy (D-191). After publish, waits for approval on the `production` environment, then runs
  # the PmpDeploy SSM document on the server: auto-deploy.sh deploys the commit and rolls back on failure.
  # GitHub signs in with OIDC as pmp-github-deploy, which may only send PmpDeploy to pmp-prod.
  # Manual fallback: ./deploy.sh <commit> over SSH, as before.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    needs: [publish]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-2
      - name: Deploy ${{ steps.tag.outputs.tag }} on the server
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          INSTANCE: ${{ vars.SSM_INSTANCE_ID }}
        run: |
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name PmpDeploy \
                 --parameters "tag=$TAG" --comment "deploy $TAG (run $GITHUB_RUN_ID)" \
                 --query Command.CommandId --output text)
          echo "SSM command $id"
          status=Pending
          for i in $(seq 1 120); do
            sleep 15
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" --query StandardErrorContent --output text >&2
          echo "Deploy $TAG: $status" >> "$GITHUB_STEP_SUMMARY"
          [ "$status" = Success ]
