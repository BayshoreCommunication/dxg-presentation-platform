# A local rehearsal of the production stack — nothing leaves this machine.
#
#   docker compose -f docker-compose.yml -f docker-compose.rehearsal.yml --env-file rehearsal.env up -d
#
# Differences from production, and only these: MinIO stands in for S3; the hosts are
# pmp.localhost / speakers.localhost with Caddy's internal (untrusted) certificates on
# 8443; and the backup job is not started.
services:
  caddy:
    ports: !override ["8080:80", "8443:443"]
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      retries: 20
  minio-bucket:
    image: minio/mc:latest
    entrypoint: ["sh", "-c", "mc alias set m http://minio:9000 $$AWS_ACCESS_KEY_ID $$AWS_SECRET_ACCESS_KEY && mc mb -p m/$$S3_BUCKET"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      minio: { condition: service_healthy }
  api:
    depends_on:
      minio-bucket: { condition: service_completed_successfully }
  backup:
    profiles: ["never"]
